[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "askmycode"
version = "0.1.0"
description = "Ask questions about any codebase using AI — your code stays private"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["ai", "cli", "codebase", "qa", "embeddings", "rag", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typer>=0.12.0",
    "google-genai>=2.0.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "pathspec>=0.12.0",
    "rich>=13.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
askmycode = "askmycode.cli:app"

[project.urls]
Homepage = "https://github.com/NewtYao/askmycode"
Issues = "https://github.com/NewtYao/askmycode/issues"
